name: Deploy ctrl-rest

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite deploy manual desde GitHub

jobs:
  deploy-backend:
    name: Deploy Lambdas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy cada Lambda
      - name: Deploy completarActividad
        run: |
          cd backend/lambdas/completarActividad
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-completarActividad \
            --zip-file fileb://function.zip

      - name: Deploy obtenerPerfil
        run: |
          cd backend/lambdas/obtenerPerfil
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-obtenerPerfil \
            --zip-file fileb://function.zip

      - name: Deploy obtenerRacha
        run: |
          cd backend/lambdas/obtenerRacha
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-obtenerRacha \
            --zip-file fileb://function.zip

      - name: Deploy obtenerLeaderboard
        run: |
          cd backend/lambdas/obtenerLeaderboard
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-obtenerLeaderboard \
            --zip-file fileb://function.zip

      - name: Deploy iniciarPausa
        run: |
          cd backend/lambdas/iniciarPausa
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-iniciarPausa \
            --zip-file fileb://function.zip

      - name: Deploy generarReto
        run: |
          cd backend/lambdas/generarReto
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name pausa-activa-generarReto \
            --zip-file fileb://function.zip

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
            aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
